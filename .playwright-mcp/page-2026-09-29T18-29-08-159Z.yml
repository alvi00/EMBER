              - /url: https://www.nasa.gov/missions/station/iss-research/studying-combustion-and-fire-safety/
          - listitem [ref=f10e152]:
            - link "Cool Flames Created During a First for International Space Station Research" [ref=f10e153] [cursor=pointer]:
              - /url: https://www.nasa.gov/missions/station/cool-flames-created-during-a-first-for-international-space-station-research/
        - paragraph [ref=f10e154]:
          - strong [ref=f10e155]: About BPS
        - paragraph [ref=f10e156]:
          - link [ref=f10e157] [cursor=pointer]:
            - /url: https://science.nasa.gov/biological-physical
            - strong [ref=f10e158]: NASA’s Biological and Physical Sciences Division
          - text: pioneers scientific discovery and enables exploration by using space environments to conduct investigations not possible on Earth. Studying biological and physical phenomenon under extreme conditions allows researchers to advance the fundamental scientific knowledge required to go farther and stay longer in space, while also benefitting life on Earth.
