        - heading "Why NASA is studying flames in space" [level=1] [ref=f10e73]
        - heading [level=2]
        - heading "Space combustion research is helping keep future astronauts safe" [level=2] [ref=f10e74]
        - generic [ref=f10e77]:
          - figure [ref=f10e78]:
            - link "Many flame images are shown side by side. Initially, the flame is seen as yellow and sooty. As the ambient pressure is reduced, the flame becomes bluer and continues to shrink until fully extinguished.":
              - /url: https://science.nasa.gov/wp-content/uploads/2024/10/jsc2023e013681medium.jpg
              - img "Many flame images are shown side by side. Initially, the flame is seen as yellow and sooty. As the ambient pressure is reduced, the flame becomes bluer and continues to shrink until fully extinguished." [ref=f10e79] [cursor=pointer]
          - generic [ref=f10e80]:
            - generic [ref=f10e81]: This image shows a sequence of snapshots taken about 3 seconds apart during the Solid Fuel Ignition and Extinction (SoFIE) Growth and Extinction Limits (GEL) experiment aboard the space station.
            - generic [ref=f10e82]: "Credit: NASA"
        - paragraph [ref=f10e83]:
          - text: While setting a fire in space sounds like a bad idea, scientists have been safely creating controlled flames in space for decades. These experiments, many of which are sponsored by NASA’s
          - link "Biological and Physical Sciences (BPS) Division" [ref=f10e84] [cursor=pointer]:
            - /url: https://science.nasa.gov/biological-physical
          - text: ", are improving our understanding of combustion and the safety of future deep space explorers."
        - heading [level=4] [ref=f10e85]:
          - strong [ref=f10e86]: What causes flames to behave differently in space?
        - paragraph [ref=f10e87]: When you remove Earth’s gravitational pull, flames behave much differently. The typical shape of a candle flame is caused by less dense warm air rising to be replaced by cooler ambient air from below. In microgravity, however, that circulation effect does not happen, creating a spherical flame!
        - generic [ref=f10e90]:
          - figure [ref=f10e91]:
            - 'img "A spherical flame created in space (left), and a candle flame burning on Earth (right) Alt Text: An orange spherical flame created in space (left), and an orange candle flame burning on Earth (right) against a black background" [ref=f10e92]'
          - emphasis [ref=f10e95]: A spherical flame created in space (left), and a candle flame burning on Earth (right)
        - heading [level=4] [ref=f10e96]:
          - strong [ref=f10e97]: Why study flames in space?
        - paragraph [ref=f10e98]: Gravity is a strong force that can cloud scientific studies on Earth. Studying combustion in microgravity provides a unique opportunity for scientists to better understand the fundamental aspects of combustion without that clouding effect of gravity.
        - paragraph [ref=f10e99]: Additionally, researchers study fire in space to better protect astronauts. Astronauts must know what to expect in case of a fire emergency. Unlike on Earth, Astronauts cannot leave the spacecraft and dial 911. The spacecraft environment must be made as safe as possible by using materials that do not burn whenever possible. Some materials may even be more flammable in partial-gravity environments, making this research crucial.
        - generic [ref=f10e102]:
          - figure [ref=f10e103]:
            - link "NASA astronaut Kate Rubins is photographed replacing two Multi-user Droplet Combustion Apparatus (MDCA) Igniter Tips as part of the Combustion Integration Rack (CIR) Igniter Replacement operations. The CIR is used to perform combustion experiments in microgravity. The CIR can be reconfigured easily on orbit to accommodate a variety of combustion experiments. It consists of an optics bench, a combustion chamber, a fuel and oxidizer management system, environmental management systems, and interfaces for science diagnostics and experiment specific equipment.":
              - /url: https://science.nasa.gov/wp-content/uploads/2024/10/iss049e003808medium.jpg
              - img "NASA astronaut Kate Rubins is photographed replacing two Multi-user Droplet Combustion Apparatus (MDCA) Igniter Tips as part of the Combustion Integration Rack (CIR) Igniter Replacement operations. The CIR is used to perform combustion experiments in microgravity. The CIR can be reconfigured easily on orbit to accommodate a variety of combustion experiments. It consists of an optics bench, a combustion chamber, a fuel and oxidizer management system, environmental management systems, and interfaces for science diagnostics and experiment specific equipment." [ref=f10e104] [cursor=pointer]
          - generic [ref=f10e105]:
            - emphasis [ref=f10e107]: NASA astronaut Kate Rubins is photographed replacing two Multi-user Droplet Combustion Apparatus (MDCA) Igniter Tips as part of the Combustion Integration Rack (CIR) Igniter Replacement operations.
            - emphasis [ref=f10e109]: "Credit: NASA"
        - heading [level=4] [ref=f10e110]:
          - strong [ref=f10e111]: How to study fire in microgravity
        - paragraph [ref=f10e112]:
          - text: Researchers have designed International Space Station facilities to study combustion while keeping crew safe during the tests. The primary facility used to study flames aboard station is the Combustion Integrated Rack (
          - link "CIR" [ref=f10e113] [cursor=pointer]:
            - /url: https://www1.grc.nasa.gov/space/iss-research/iss-fcf/cir/
          - text: ). CIR safely contains small-scale flame studies and requires little crew interaction.
        - paragraph [ref=f10e114]:
          - text: The BPS-sponsored Solid Fuel Ignition and Extinction (
          - link "SoFIE" [ref=f10e115] [cursor=pointer]:
            - /url: https://science.nasa.gov/biological-physical/investigations/sofie/
          - text: ) experiment is designed to slot into the CIR and enables studies of ignition and the flammability of solid spacecraft materials.
        - paragraph [ref=f10e116]:
          - text: Larger scale flame studies have been conducted aboard Northrop Grumman Cygnus spacecraft after they depart station. This
          - link "Saffire" [ref=f10e117] [cursor=pointer]:
            - /url: https://www1.grc.nasa.gov/space/iss-research/msg/saffire/
          - text: series of experiments allowed for scaled-up studies of fire spread.
        - figure [ref=f10e121]:
          - link:
            - /url: https://science.nasa.gov/wp-content/uploads/2024/10/jsc2023e046631small.jpg
        - heading [level=4] [ref=f10e122]:
          - strong [ref=f10e123]: What have we learned?
        - paragraph [ref=f10e124]: After decades of space combustion research, researchers have made great progress so far.
        - list [ref=f10e125]:
          - listitem [ref=f10e126]: The discovery of a specific type of cool flame was an important breakthrough during the Flame Extinguishment Experiment (FLEX) experiment on the space station. Learning more about the behavior of these chemically different flames could lead to the development of more-efficient, less-polluting vehicles.
          - listitem [ref=f10e127]:
            - link "Confined Combustion" [ref=f10e128] [cursor=pointer]:
              - /url: https://www.nasa.gov/mission/station/research-explorer/investigation/?#id=7886
            - text: ", sponsored by the ISS National Lab, examined flame spread in confined spaces of different shapes. These results provide guidance for the design of structures, fire safety codes, and response in space and on Earth."
          - listitem [ref=f10e129]:
            - text: A number of BPS-sponsored experiments have been conducted inside of SoFIE, including
            - link "SoFIE-GEL" [ref=f10e130] [cursor=pointer]:
              - /url: https://www.nasa.gov/mission/station/research-explorer/investigation/?#id=8266
            - text: ", and"
            - link "SoFIE-MIST" [ref=f10e131] [cursor=pointer]:
              - /url: https://www.nasa.gov/mission/station/research-explorer/investigation/?#id=8272
            - text: . Together, they will help us better understand early flame growth and fire spread. The two more experiments in the future (NCA and SMuRF).
        - generic [ref=f10e134]:
          - figure [ref=f10e135]:
            - link "This image shows a 4-cm diameter sphere of acrylic burning in microgravity. The flame appears near the end of the burn, having engulfed the entire sphere after growing from a small ignition point on the right side.":
              - /url: https://science.nasa.gov/wp-content/uploads/2024/10/jsc2023e002281orig.jpg
              - img "This image shows a 4-cm diameter sphere of acrylic burning in microgravity. The flame appears near the end of the burn, having engulfed the entire sphere after growing from a small ignition point on the right side." [ref=f10e136] [cursor=pointer]
          - generic [ref=f10e137]:
            - generic [ref=f10e138]: The Solid Fuel Ignition and Extinction (SoFIE) Growth and Extinction Limits (GEL) experiment successfully conducted its first test in the Combustion Integrated Rack (CIR) aboard the International Space Station (ISS) on January 13th.
            - generic [ref=f10e139]: Image courtesy of NASA.
        - heading [level=4] [ref=f10e140]:
          - strong [ref=f10e141]: Flames on the Moon
        - paragraph [ref=f10e142]: With humanity heading back to the Moon as a part of the Artemis program, studying flames in true lunar gravity is important for crew safety. Tests will help us understand how to better design our habitats, and which materials to avoid which may be more flammable in an environment with less gravity.
        - paragraph [ref=f10e143]:
          - text: The Flammability of Materials on the Moon (FM
          - superscript [ref=f10e144]: "2"
          - text: ) study will be the first flammability test on another world. The experiment will be conducted on the lunar surface to evaluate flame size, strength, intensity and spread compared to Earth gravity.
        - paragraph [ref=f10e145]:
          - strong [ref=f10e146]: Related Resources
